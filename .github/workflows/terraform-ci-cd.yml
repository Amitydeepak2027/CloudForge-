
name: CloudForge CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-check:
    name: Terraform Format and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -backend=false

      - name: Validate Terraform
        run: terraform validate

  python-tests:
    name: Provision Infrastructure and Test API
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      TF_VAR_aws_region: us-east-1
      TF_VAR_project_name: cloudforge

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 pytest

      - name: Verify Docker
        run: |
          docker version
          docker info

      - name: Start LocalEmu with Docker access
        run: |
          docker run -d \
            --name localemu \
            -p 4566:4566 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            --group-add docker \
            localemu/localemu:latest

      - name: Wait for LocalEmu
        run: |
          ready=0

          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4566/_localemu/health; then
              ready=1
              break
            fi

            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo "LocalEmu failed to become healthy."
            docker logs localemu
            exit 1
          fi

      - name: Initialize Terraform
        run: terraform init

      - name: Provision test infrastructure
        run: terraform apply -auto-approve

      - name: Run Python API tests
        run: pytest -v tests/

      - name: Show LocalEmu logs on failure
        if: failure()
        run: docker logs localemu
